<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Somewhere — a thought, met across time</title>
<meta name="description" content="Write a thought, and meet a voice from the past who already felt it. Every quote is from a writer now in the public domain.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Hanken Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;color:#1e2a26}
  textarea{font-family:inherit}
  textarea::placeholder{color:#a7b3ac}
  textarea:focus{outline:none}
  ::selection{background:rgba(95,143,134,.22)}

  @keyframes auroraDrift{0%{transform:translate(-6%,-4%) scale(1)}50%{transform:translate(6%,5%) scale(1.12)}100%{transform:translate(-6%,-4%) scale(1)}}
  @keyframes auroraDrift2{0%{transform:translate(5%,4%) scale(1.05)}50%{transform:translate(-5%,-6%) scale(1)}100%{transform:translate(5%,4%) scale(1.05)}}
  @keyframes riseIn{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
  @keyframes fadeIn{0%{opacity:0}100%{opacity:1}}
  @keyframes breathe{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
  @keyframes lineGrow{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}

  .stage{position:fixed;inset:0;background:linear-gradient(160deg,#eef3ef 0%,#e9eef3 55%,#e7f0ef 100%);overflow:hidden;display:flex;flex-direction:column}
  .orb{position:absolute;border-radius:50%;pointer-events:none}
  .orb-a{width:60vw;height:60vw;left:-8vw;top:-12vw;background:radial-gradient(circle,rgba(122,170,155,.55),rgba(122,170,155,0) 68%);filter:blur(40px);animation:auroraDrift 26s ease-in-out infinite}
  .orb-b{width:55vw;height:55vw;right:-10vw;bottom:-14vw;background:radial-gradient(circle,rgba(120,150,184,.5),rgba(120,150,184,0) 68%);filter:blur(48px);animation:auroraDrift2 32s ease-in-out infinite}
  .glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,rgba(255,255,255,.45),rgba(255,255,255,0) 60%);pointer-events:none}

  header{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:30px 40px}
  .brand{display:flex;align-items:center;gap:9px;cursor:pointer;background:none;border:none;font-family:inherit}
  .brand .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,#5f8f86,#5b7f9e)}
  .brand .name{font-size:17px;font-weight:500;letter-spacing:.01em;color:#36433d}
  .strap{font-size:13px;font-weight:400;color:#8a958f;letter-spacing:.02em}

  main{position:relative;z-index:2;flex:1;display:flex;align-items:center;justify-content:center;padding:0 28px}

  /* Input phase */
  .input-view{width:100%;max-width:720px;display:flex;flex-direction:column;align-items:center;text-align:center;animation:fadeIn .6s ease both}
  .prompt{font-size:15px;font-weight:400;letter-spacing:.06em;text-transform:uppercase;color:#8a958f;margin-bottom:26px}
  #thought{width:100%;border:none;background:transparent;resize:none;overflow:hidden;text-align:center;font-size:38px;font-weight:300;line-height:1.4;color:#1e2a26;caret-color:#5f8f86}
  .rule{width:100%;height:1px;margin-top:14px;background:linear-gradient(90deg,transparent,rgba(95,143,134,.4),transparent)}
  .actions{margin-top:30px;display:flex;align-items:center;gap:14px;min-height:44px}
  .listen{display:inline-flex;align-items:center;gap:10px;border:none;cursor:pointer;background:#26352f;color:#f3f7f4;font-family:inherit;font-size:15px;font-weight:500;letter-spacing:.01em;padding:13px 24px;border-radius:100px;animation:fadeIn .4s ease both;transition:background .2s ease}
  .listen:hover{background:#1b2722}
  .listen .key{font-size:12px;opacity:.7;font-weight:400}
  .hint{font-size:14px;color:#a7b3ac;font-weight:400}

  /* Searching phase */
  .search-view{width:100%;max-width:640px;display:flex;flex-direction:column;align-items:center;text-align:center;animation:fadeIn .5s ease both}
  .echo{font-size:24px;font-weight:300;line-height:1.5;color:#5a665f;font-style:italic}
  .dots{margin-top:40px;display:flex;align-items:center;gap:9px}
  .dots span{width:7px;height:7px;border-radius:50%}
  .dots span:nth-child(1){background:#5f8f86;animation:breathe 1.4s ease-in-out infinite}
  .dots span:nth-child(2){background:#638a92;animation:breathe 1.4s ease-in-out .22s infinite}
  .dots span:nth-child(3){background:#5b7f9e;animation:breathe 1.4s ease-in-out .44s infinite}
  .searching-label{margin-top:22px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#9aa5a0}

  /* Result phase */
  .result-view{width:100%;max-width:780px;display:flex;flex-direction:column;align-items:center;text-align:center}
  .you-wrote{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#9aa5a0;animation:fadeIn .5s ease both}
  .echo-soft{margin-top:10px;font-size:16px;font-weight:400;line-height:1.5;color:#7c8884;max-width:540px;animation:fadeIn .6s ease both}
  .divider{width:54px;height:1px;margin:32px 0;background:linear-gradient(90deg,transparent,rgba(95,143,134,.55),transparent);transform-origin:center;animation:lineGrow .7s ease .2s both}
  blockquote{font-size:40px;font-weight:300;line-height:1.34;color:#1e2a26;letter-spacing:-.01em;text-wrap:pretty;animation:riseIn .8s cubic-bezier(.2,.7,.2,1) .3s both}
  .attrib{margin-top:30px;display:flex;flex-direction:column;align-items:center;gap:4px;animation:riseIn .8s cubic-bezier(.2,.7,.2,1) .5s both}
  .attrib .author{font-size:17px;font-weight:500;color:#36433d}
  .attrib .source{font-size:14px;font-weight:400;color:#9aa5a0}
  .again{margin-top:48px;border:1px solid rgba(95,143,134,.4);cursor:pointer;background:transparent;color:#3c4a43;font-family:inherit;font-size:15px;font-weight:500;padding:12px 24px;border-radius:100px;animation:fadeIn .6s ease .8s both;transition:background .2s ease,border-color .2s ease}
  .again:hover{background:rgba(95,143,134,.1);border-color:rgba(95,143,134,.6)}

  footer{position:relative;z-index:2;text-align:center;padding:24px;font-size:12px;color:#a7b3ac;letter-spacing:.02em}

  [hidden]{display:none !important}

  @media(max-width:640px){
    header{padding:24px}
    .strap{display:none}
    #thought{font-size:30px}
    blockquote{font-size:30px}
    .echo{font-size:21px}
  }
  @media(prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;animation-iteration-count:1 !important}
  }
</style>
</head>
<body>
<div class="stage">
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>
  <div class="glow"></div>

  <header>
    <button class="brand" id="brand" aria-label="Start over">
      <span class="dot"></span>
      <span class="name">somewhere</span>
    </button>
    <span class="strap">a thought, met across time</span>
  </header>

  <main>
    <!-- Input -->
    <section class="input-view" id="view-input">
      <p class="prompt">What's on your mind?</p>
      <textarea id="thought" rows="1" placeholder="Write a thought…" aria-label="Write a thought"></textarea>
      <div class="rule"></div>
      <div class="actions">
        <button class="listen" id="listen" hidden>Listen <span class="key">Enter</span></button>
        <span class="hint" id="hint">Somewhere, someone already felt this.</span>
      </div>
    </section>

    <!-- Searching -->
    <section class="search-view" id="view-search" hidden>
      <p class="echo" id="echo"></p>
      <div class="dots"><span></span><span></span><span></span></div>
      <p class="searching-label">Searching across time</p>
    </section>

    <!-- Result -->
    <section class="result-view" id="view-result" hidden>
      <p class="you-wrote">You wrote</p>
      <p class="echo-soft" id="echo-soft"></p>
      <div class="divider"></div>
      <blockquote id="quote-text"></blockquote>
      <div class="attrib">
        <span class="author" id="quote-author"></span>
        <span class="source" id="quote-source"></span>
      </div>
      <button class="again" id="again">Write another</button>
    </section>
  </main>

  <footer>Every quote is from a voice now in the public domain.</footer>
</div>

<script>
(function(){
  var quotes = [
    {text:"Confine yourself to the present.",author:"Marcus Aurelius",source:"Meditations, c. 180",keywords:["time","present","now","future","past","worry","busy","rushing","late","ahead"]},
    {text:"It is not that we have a short time to live, but that we waste much of it.",author:"Seneca",source:"On the Shortness of Life, c. 49",keywords:["time","busy","wasting","waste","old","age","hurry","late","short","life"]},
    {text:"I never found the companion that was so companionable as solitude.",author:"Henry David Thoreau",source:"Walden, 1854",keywords:["alone","lonely","loneliness","solitude","myself","isolated","quiet","empty"]},
    {text:"Be patient toward all that is unsolved in your heart, and try to love the questions themselves.",author:"Rainer Maria Rilke",source:"Letters to a Young Poet, 1903",keywords:["doubt","unsure","confused","uncertain","question","questions","dont know","don't know","searching","answers","wonder"]},
    {text:"We suffer more often in imagination than in reality.",author:"Seneca",source:"Letters from a Stoic, c. 65",keywords:["fear","afraid","scared","anxious","worry","worried","nervous","dread","anxiety","stress","panic"]},
    {text:"No man ever steps in the same river twice.",author:"Heraclitus",source:"Fragments, c. 500 BCE",keywords:["change","different","new","moving","transition","grow","growing","flow","constant"]},
    {text:"Hope is the thing with feathers that perches in the soul.",author:"Emily Dickinson",source:"c. 1861",keywords:["hope","wish","dream","better","faith","light","believe","tomorrow"]},
    {text:"Go confidently in the direction of your dreams. Live the life you have imagined.",author:"Henry David Thoreau",source:"Walden, 1854",keywords:["dream","dreams","purpose","goal","goals","ambition","future","direction","want","become"]},
    {text:"In every walk with nature one receives far more than he seeks.",author:"John Muir",source:"My First Summer in the Sierra, 1911",keywords:["nature","walk","outside","tree","trees","mountain","sky","sea","ocean","forest","green","earth"]},
    {text:"Nature does not hurry, yet everything is accomplished.",author:"Lao Tzu",source:"Tao Te Ching, c. 400 BCE",keywords:["calm","peace","peaceful","patience","hurry","rushing","slow","busy","stress","overwhelmed","breathe"]},
    {text:"He who has a why to live for can bear almost any how.",author:"Friedrich Nietzsche",source:"Twilight of the Idols, 1889",keywords:["meaning","purpose","why","point","reason","pointless","struggle","hard","suffering","endure"]},
    {text:"When I let go of what I am, I become what I might be.",author:"Lao Tzu",source:"Tao Te Ching, c. 400 BCE",keywords:["letting go","let go","change","lost","identity","become","release","stuck","control"]},
    {text:"It is not enough to be busy; the question is, what are we busy about?",author:"Henry David Thoreau",source:"Letter to H. G. O. Blake, 1857",keywords:["busy","work","rushing","job","productivity","tired","overworked","grind","hustle"]},
    {text:"Sometimes even to live is an act of courage.",author:"Seneca",source:"Letters from a Stoic, c. 65",keywords:["courage","brave","struggle","hard","strong","strength","fight","tired","weary","keep going","exhausted","survive"]},
    {text:"Death is not extinguishing the light; it is putting out the lamp because the dawn has come.",author:"Rabindranath Tagore",source:"Stray Birds, 1916",keywords:["death","loss","grief","gone","mourning","die","died","goodbye","miss","passed"]},
    {text:"How do I love thee? Let me count the ways.",author:"Elizabeth Barrett Browning",source:"Sonnets from the Portuguese, 1850",keywords:["love","heart","lover","romance","romantic","relationship","adore","crush","fall"]},
    {text:"Happiness depends upon ourselves.",author:"Aristotle",source:"Nicomachean Ethics, c. 340 BCE",keywords:["happy","happiness","joy","content","grateful","gratitude","fulfillment","glad","smile"]},
    {text:"I exist as I am, that is enough.",author:"Walt Whitman",source:"Leaves of Grass, 1855",keywords:["enough","self","worth","accept","acceptance","content","myself","value","doubt myself","insecure"]}
  ];

  var ta = document.getElementById('thought');
  var listen = document.getElementById('listen');
  var hint = document.getElementById('hint');
  var views = {
    input: document.getElementById('view-input'),
    search: document.getElementById('view-search'),
    result: document.getElementById('view-result')
  };
  var timer = null;

  function findMatch(thought){
    var t = ' ' + thought.toLowerCase() + ' ';
    var best = null, bestScore = 0;
    for(var i=0;i<quotes.length;i++){
      var q = quotes[i], score = 0;
      for(var j=0;j<q.keywords.length;j++){
        var k = q.keywords[j];
        if(t.indexOf(k) !== -1) score += k.indexOf(' ') !== -1 ? 2 : 1;
      }
      if(score > bestScore){ bestScore = score; best = q; }
    }
    if(!best) best = quotes[Math.floor(Math.random()*quotes.length)];
    return best;
  }

  function grow(){ ta.style.height='auto'; ta.style.height = ta.scrollHeight + 'px'; }

  function show(phase){
    for(var k in views){ views[k].hidden = (k !== phase); }
  }

  function refreshInput(){
    var has = ta.value.trim().length > 0;
    listen.hidden = !has;
    hint.hidden = has;
    grow();
  }

  function submit(){
    var thought = ta.value.trim();
    if(thought.length === 0) return;
    document.getElementById('echo').textContent = thought;
    show('search');
    clearTimeout(timer);
    timer = setTimeout(function(){
      var m = findMatch(thought);
      document.getElementById('echo-soft').textContent = thought;
      document.getElementById('quote-text').textContent = m.text;
      document.getElementById('quote-author').textContent = m.author;
      document.getElementById('quote-source').textContent = m.source;
      show('result');
    }, 1900);
  }

  function reset(){
    clearTimeout(timer);
    ta.value = '';
    refreshInput();
    show('input');
    setTimeout(function(){ ta.style.height='auto'; ta.focus(); }, 60);
  }

  ta.addEventListener('input', refreshInput);
  ta.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); submit(); }
  });
  listen.addEventListener('click', submit);
  document.getElementById('again').addEventListener('click', reset);
  document.getElementById('brand').addEventListener('click', reset);

  refreshInput();
  ta.focus();
})();
</script>
</body>
</html>
